name: pg-ha-lab

x-patroni: &patroni
  build: ./patroni
  env_file: .env
  depends_on:
    etcd:
      condition: service_healthy
  restart: "no" # failover tests kill nodes on purpose; Patroni, not Docker, owns recovery
  volumes:
    - ./sql:/sql:ro
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: etcd
    command: >
      etcd --name etcd --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test:
        [
          "CMD",
          "etcdctl",
          "--endpoints=http://localhost:2379",
          "endpoint",
          "health",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  pg1:
    <<: *patroni
    container_name: pg1
    hostname: pg1
    environment: { NODE_NAME: pg1 }
    ports: ["8008:8008"]
    volumes:
      - ./sql:/sql:ro
      - pg1-data:/pgdata

  pg2:
    <<: *patroni
    container_name: pg2
    hostname: pg2
    environment: { NODE_NAME: pg2 }
    ports: ["8009:8008"]
    volumes:
      - ./sql:/sql:ro
      - pg2-data:/pgdata

  pg3:
    <<: *patroni
    container_name: pg3
    hostname: pg3
    environment: { NODE_NAME: pg3 }
    ports: ["8010:8008"]
    volumes:
      - ./sql:/sql:ro
      - pg3-data:/pgdata

  haproxy:
    image: haproxy:2.9-alpine
    container_name: haproxy
    depends_on: [pg1, pg2, pg3]
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "15000:5000" # read/write  -> current primary
      - "15001:5001" # read-only   -> replicas
      - "17000:7000" # HAProxy stats UI

  analytics:
    image: postgres:16-bookworm
    container_name: analytics
    environment:
      POSTGRES_PASSWORD: ${ANALYTICS_PASSWORD}
      POSTGRES_DB: analytics
    volumes:
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/analytics_views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
      - analytics-data:/var/lib/postgresql/data
    ports: ["5440:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 20

  cdc-init:
    image: postgres:16-bookworm
    container_name: cdc-init
    depends_on:
      analytics: { condition: service_healthy }
      haproxy: { condition: service_started }
    environment:
      CDC_PASSWORD: ${CDC_PASSWORD}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD}
    volumes:
      - ./scripts/cdc_init.sh:/cdc_init.sh:ro
    entrypoint: ["bash", "/cdc_init.sh"]
    restart: "no"

  exporter-pg1: &exporter
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: exporter-pg1
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${EXPORTER_PASSWORD}@pg1:5432/postgres?sslmode=disable
  exporter-pg2:
    <<: *exporter
    container_name: exporter-pg2
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${EXPORTER_PASSWORD}@pg2:5432/postgres?sslmode=disable
  exporter-pg3:
    <<: *exporter
    container_name: exporter-pg3
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${EXPORTER_PASSWORD}@pg3:5432/postgres?sslmode=disable

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  etcd-data:
  pg1-data:
  pg2-data:
  pg3-data:
  analytics-data:
