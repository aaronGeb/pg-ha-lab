global
    maxconn 500

defaults
    mode tcp
    log global
    retries 2
    timeout connect 3s
    timeout client  30m
    timeout server  30m
    timeout check   2s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
    accepted_payload_size 8192

listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 2s
